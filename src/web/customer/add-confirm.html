<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客登録確認</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">以下の内容で登録します。よろしいですか？</h2>
        <table class="table">
            <tr><th>会社名</th><td id="companyName"></td></tr>
            <tr><th>業種</th><td id="industry"></td></tr>
            <tr><th>連絡先</th><td id="contact"></td></tr>
            <tr><th>所在地</th><td id="location"></td></tr>
        </table>
        <button id="back-btn" class="btn btn-secondary">戻る</button>
        <button id="submit-btn" class="btn btn-primary">登録する</button>
    </div>

    <script type="module">
        import config from '../config.js';

        const data = JSON.parse(sessionStorage.getItem('customerFormData'));

        if (!data) {
            alert('入力情報がありません。入力画面からやり直してください。');
            window.location.href = 'add.html';
        } else {
            document.getElementById('companyName').textContent = data.companyName;
            document.getElementById('industry').textContent = data.industry;
            document.getElementById('contact').textContent = data.contact;
            document.getElementById('location').textContent = data.location;
        }

        document.getElementById('submit-btn').addEventListener('click', function() {
            fetch(config.apiUrl + '/add-customer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams(data)
            }).then(response => response.json())
              .then(result => {
                if (result.success) {
                    sessionStorage.removeItem('customerFormData');
                    alert('顧客情報が正常に保存されました。');
                    window.location.href = 'list.html';
                } else {
                    alert('保存に失敗しました。');
                }
              })
              .catch(error => console.error('Error:', error));
        });

        document.getElementById('back-btn').addEventListener('click', function() {
            window.location.href = 'add.html';
        });
    </script>
</body>
</html>
