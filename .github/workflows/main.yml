name: production deploy
on:
  push:
    branches:
      - main
jobs:
  staging-deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSHE_SSH_KEY }}
      - name: Stagingへデプロイ
        run: ssh ${{ steps.ssh.outputs.SERVER }} bash /app/ri_nakamura/deploy.sh ri_nakamura
      - name: Cypressテスト実行
        run: ssh ${{ steps.ssh.outputs.SERVER }} "cd /ci && npx cypress run --browser chrome --spec cypress/e2e/ri_nakamura.*"

  production-deploy:
    needs: staging-deploy-and-test
    runs-on: ubuntu-latest
    steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSHE_SSH_KEY }}
      - name: Productionへデプロイ
        run: ssh ${{ steps.ssh.outputs.SERVER }} bash /app/ri_nakamura/deploy.sh ri_nakamura
